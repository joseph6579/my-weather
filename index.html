<!doctype html>
<html lang="en" x-data="weather()" x-init="init()">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        const WEATHER_API_ENDPOINT = 'https://api.weather-ai.co/v1/hourly';
        const WEATHER_TOKEN = '%VITE_WEATHER_TOKEN%';
        const GOOGLE_MAPS_KEY = '%VITE_GOOGLE_MAPS_KEY%';
    </script>
    <script>
        window.initGoogleMaps = function () {
            window._googleMapsReady = true;
            window.dispatchEvent(new Event('googlemapsready'));
        };
        const gToken = GOOGLE_MAPS_KEY
        // Load Maps only when key is present
        if (gToken) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${gToken}&libraries=places&callback=initGoogleMaps`;
            s.async = true;
            document.head.appendChild(s);
        }
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        [x-cloak] {
            display: none !important;
        }

        body {
            background: linear-gradient(160deg, #0d1b2a 0%, #0f2744 40%, #152e52 70%, #0d1b2a 100%);
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .scroll-x {
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-x::-webkit-scrollbar {
            display: none;
        }

        @keyframes pulse-soft {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }
        }

        .loading-pulse {
            animation: pulse-soft 1.6s ease-in-out infinite;
        }

        .hourly-card {
            transition: background 0.18s, transform 0.18s;
        }

        .hourly-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .daily-row {
            transition: background 0.15s;
        }

        .daily-row:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        input {
            color: white;
        }

        /* Google Maps autocomplete dropdown */
        .pac-container {
            background: #0f2744;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            margin-top: 4px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            font-family: 'Inter', sans-serif;
            z-index: 9999;
        }

        .pac-item {
            padding: 10px 14px;
            color: rgba(255, 255, 255, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            cursor: pointer;
            font-size: 14px;
            background: transparent;
        }

        .pac-item:first-child {
            border-top: none;
        }

        .pac-item:hover,
        .pac-item-selected {
            background: rgba(255, 255, 255, 0.08);
        }

        .pac-item-query {
            color: white;
            font-weight: 500;
        }

        .pac-matched {
            font-weight: 600;
        }

        .pac-icon {
            display: none;
        }
    </style>
</head>

<body class="text-white">
    <div class="max-w-3xl mx-auto px-4 py-8">

        <!-- ── Search bar ──────────────────────────────────────── -->
        <div class="relative mb-8">
            <div class="glass rounded-2xl flex items-center gap-3 px-4 py-3">
                <!-- magnifier -->
                <svg class="w-5 h-5 text-white/40 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
                </svg>

                <input id="location-search" type="text" placeholder="Search location…"
                    class="flex-1 bg-transparent outline-none text-sm font-light" />

                <!-- spinner -->
                <svg x-show="loading" class="w-4 h-4 text-white/50 animate-spin shrink-0" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z" />
                </svg>

                <!-- clear -->
                <button x-show="data && !loading" @click="resetSearch()"
                    class="text-white/30 hover:text-white/60 transition-colors shrink-0">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- error message -->
            <p x-show="error" x-text="error" class="text-red-300/80 text-xs mt-2 px-1"></p>
        </div>

        <!-- ── Loading skeleton ────────────────────────────────── -->
        <div x-show="loading" x-cloak class="space-y-4">
            <div class="glass rounded-3xl loading-pulse h-52"></div>
            <div class="glass rounded-2xl loading-pulse h-32"></div>
            <div class="glass rounded-2xl loading-pulse h-48"></div>
        </div>

        <!-- ── Weather content ─────────────────────────────────── -->
        <div x-show="data && !loading" x-cloak class="space-y-4">

            <!-- Current weather -->
            <div class="glass-strong rounded-3xl p-6 relative overflow-hidden">
                <div class="absolute -top-16 -right-16 w-56 h-56 rounded-full opacity-10 blur-3xl"
                    :style="`background:${isNight() ? '#4a90d9' : '#f4a020'}`"></div>

                <div class="flex items-start justify-between gap-4">
                    <div>
                        <!-- location label -->
                        <div class="flex items-center gap-1.5 mb-2">
                            <svg x-show="locationLabel != ''" class="w-3.5 h-3.5 text-white/50 shrink-0"
                                fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z" />
                            </svg>
                            <span class="text-white/50 text-xs font-light truncate max-w-xs" x-text="locationLabel"
                                x-show="locationLabel != ''"></span>
                        </div>

                        <!-- temperature -->
                        <div class="text-7xl font-light leading-none tracking-tight"
                            x-text="`${Math.round(data?.current?.temperature ?? 0)}°`"></div>

                        <!-- condition -->
                        <div class="mt-2 text-white/70 text-sm font-light"
                            x-text="conditionLabel(data?.current?.condition_code)"></div>

                        <!-- feels like -->
                        <div class="mt-1 text-white/40 text-xs"
                            x-text="currentHourly()?.feels_like != null ? `Feels like ${currentHourly().feels_like}°C` : ''">
                        </div>
                    </div>

                    <!-- condition icon -->
                    <img :src="data?.current?.icon" class="w-20 h-20 shrink-0 drop-shadow-lg" alt=""
                        onerror="this.style.display='none'" />
                </div>

                <!-- quick stats -->
                <div class="mt-6 grid grid-cols-3 gap-3">
                    <div class="glass rounded-xl px-3 py-2.5 text-center">
                        <div class="text-white/40 text-xs mb-1">Humidity</div>
                        <div class="text-white font-light text-sm"
                            x-text="currentHourly()?.humidity != null ? `${currentHourly().humidity}%` : '—'"></div>
                    </div>
                    <div class="glass rounded-xl px-3 py-2.5 text-center">
                        <div class="text-white/40 text-xs mb-1">Wind</div>
                        <div class="flex items-center justify-center gap-1">
                            <span class="text-white/70 text-xs inline-block"
                                :style="`transform:rotate(${(data?.current?.wind_direction ?? 0) + 180}deg)`">↑</span>
                            <span class="text-white font-light text-sm"
                                x-text="`${data?.current?.wind_speed ?? '—'} km/h`"></span>
                        </div>
                    </div>
                    <div class="glass rounded-xl px-3 py-2.5 text-center">
                        <div class="text-white/40 text-xs mb-1">Local time</div>
                        <div class="text-white font-light text-sm" x-text="formatTime(data?.current?.time)"></div>
                    </div>
                </div>
            </div>

            <!-- Hourly forecast -->
            <div class="glass rounded-2xl p-4">
                <div class="text-white/40 text-xs uppercase tracking-widest mb-3 px-1">Hourly</div>
                <div class="scroll-x">
                    <div class="flex gap-2 pb-1" style="width:max-content">
                        <template x-for="(h, i) in todayHourly()" :key="i">
                            <div class="hourly-card glass rounded-xl px-3 py-3 text-center w-[66px] cursor-default">
                                <div class="text-white/40 text-xs mb-2" x-text="formatHour(h.time)"></div>
                                <img :src="h.icon" class="w-8 h-8 mx-auto mb-2" alt=""
                                    onerror="this.style.display='none'" />
                                <div class="text-white text-sm font-light" x-text="`${Math.round(h.temperature)}°`">
                                </div>
                                <div x-show="h.precipitation_probability > 0" class="text-blue-300 text-xs mt-1"
                                    x-text="`${h.precipitation_probability}%`"></div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Detail tiles -->
            <div class="grid grid-cols-2 gap-3">

                <!-- UV index -->
                <div class="glass rounded-2xl p-4">
                    <div class="text-white/40 text-xs uppercase tracking-widest mb-3">UV Index</div>
                    <div class="text-3xl font-light"
                        x-text="currentHourly()?.uv_index != null ? currentHourly().uv_index.toFixed(1) : '—'"></div>
                    <div class="text-white/50 text-xs mt-1" x-text="uvLabel(currentHourly()?.uv_index)"></div>
                    <div class="mt-3 h-1.5 rounded-full bg-white/10 overflow-hidden">
                        <div class="h-full rounded-full transition-all duration-700"
                            :style="`width:${Math.min(100,((currentHourly()?.uv_index ?? 0)/11)*100)}%;background:${uvColor(currentHourly()?.uv_index)}`">
                        </div>
                    </div>
                </div>

                <!-- Wind detail -->
                <div class="glass rounded-2xl p-4">
                    <div class="text-white/40 text-xs uppercase tracking-widest mb-3">Wind</div>
                    <div class="text-3xl font-light" x-text="data?.current?.wind_speed ?? '—'"></div>
                    <div class="text-white/50 text-xs mt-1">km/h</div>
                    <div class="mt-3 text-white/40 text-xs" x-text="`Gust: ${currentHourly()?.wind_gust ?? '—'} km/h`">
                    </div>
                    <div class="mt-1 text-white/40 text-xs"
                        x-text="`Direction: ${windDir(data?.current?.wind_direction)}`"></div>
                </div>

                <!-- Sunrise / sunset -->
                <div class="glass rounded-2xl p-4">
                    <div class="text-white/40 text-xs uppercase tracking-widest mb-3">Sun</div>
                    <div class="flex items-center gap-2 mb-2.5">
                        <!-- sunrise icon -->
                        <svg class="w-4 h-4 text-amber-300 shrink-0" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 3v1m0 16v1M4.22 4.22l.7.7m14.16 14.16.7.7M1 12h1m20 0h1M4.22 19.78l.7-.7M19.08 4.92l.7-.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-4-9v2M5 19H3m18 0h-2" />
                        </svg>
                        <span class="text-white/60 text-xs">Rise</span>
                        <span class="text-white text-sm ml-auto font-light"
                            x-text="formatTime(todayDaily()?.sunrise)"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <!-- sunset icon -->
                        <svg class="w-4 h-4 text-orange-400 shrink-0" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 3v1m0 16v1M4.22 4.22l.7.7m14.16 14.16.7.7M1 12h1m20 0h1M4.22 19.78l.7-.7M19.08 4.92l.7-.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zm-4-9v2M5 19H3m18 0h-2" />
                        </svg>
                        <span class="text-white/60 text-xs">Set</span>
                        <span class="text-white text-sm ml-auto font-light"
                            x-text="formatTime(todayDaily()?.sunset)"></span>
                    </div>
                </div>

                <!-- Humidity + feels like -->
                <div class="glass rounded-2xl p-4">
                    <div class="text-white/40 text-xs uppercase tracking-widest mb-3">Humidity</div>
                    <div class="text-3xl font-light"
                        x-text="currentHourly()?.humidity != null ? `${currentHourly().humidity}%` : '—'"></div>
                    <div class="mt-3 text-white/40 text-xs"
                        x-text="currentHourly()?.feels_like != null ? `Feels like ${currentHourly().feels_like}°C` : ''">
                    </div>
                </div>
            </div>

            <!-- 7-day forecast -->
            <div class="glass rounded-2xl overflow-hidden">
                <div class="px-5 pt-4 pb-2 text-white/40 text-xs uppercase tracking-widest">7-Day Forecast</div>
                <template x-for="(day, i) in data?.daily ?? []" :key="i">
                    <div class="daily-row flex items-center gap-3 px-5 py-3.5 border-t border-white/5">
                        <div class="w-20 text-white/60 text-sm font-light shrink-0" x-text="formatDay(day.date, i)">
                        </div>
                        <img :src="day.icon" class="w-7 h-7 shrink-0" alt="" onerror="this.style.display='none'" />
                        <div class="flex-1 text-white/50 text-xs hidden sm:block"
                            x-text="conditionLabel(day.condition_code)"></div>
                        <div x-show="day.precipitation_probability > 0"
                            class="text-blue-300 text-xs w-8 text-right shrink-0"
                            x-text="`${day.precipitation_probability}%`"></div>
                        <div class="flex items-center gap-2 ml-1 shrink-0">
                            <span class="text-white/40 text-sm w-8 text-right font-light"
                                x-text="`${Math.round(day.temp_min)}°`"></span>
                            <div class="w-20 h-1.5 rounded-full bg-white/10 overflow-hidden hidden sm:block">
                                <div class="h-full rounded-full bg-gradient-to-r from-blue-400 to-orange-400"
                                    :style="`margin-left:${tempBarLeft(day)}%;width:${tempBarWidth(day)}%`"></div>
                            </div>
                            <span class="text-white text-sm w-8 font-light"
                                x-text="`${Math.round(day.temp_max)}°`"></span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Footer -->
            <div class="text-center text-white/20 text-xs pb-2"
                x-text="`${data?.location?.country ?? ''} · ${data?.location?.timezone ?? ''}`"></div>

        </div>

        <div x-show="!data && !loading" x-cloak class="text-center py-24">
            <svg class="w-16 h-16 mx-auto mb-4 text-white/10" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="1">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
            </svg>
            <p class="text-white/30 text-sm">Search for a location to get started</p>
        </div>

    </div>


    <script>
        function weather() {
            return {
                data: null,
                loading: false,
                error: null,
                locationLabel: '',

                /* ─ lifecycle ─ */
                async init() {
                    await this.fetchWeather(null, null, ' ');
                    if (window._googleMapsReady) {
                        this.setupAutocomplete();
                    } else {
                        window.addEventListener('googlemapsready', () => this.setupAutocomplete());
                    }
                },

                /* ─ Google Maps Places autocomplete ─ */
                setupAutocomplete() {
                    if (!window.google?.maps?.places) return;
                    const input = document.getElementById('location-search');
                    const ac = new google.maps.places.Autocomplete(input, {
                        types: ['geocode', 'establishment'],
                        fields: ['geometry', 'formatted_address', 'name'],
                        componentRestrictions: { country: 'ke' }
                    });
                    ac.addListener('place_changed', () => {
                        const place = ac.getPlace();
                        if (!place.geometry?.location) return;
                        const lat = place.geometry.location.lat();
                        const lon = place.geometry.location.lng();
                        const label = place.formatted_address || place.name || '';
                        this.fetchWeather(lat, lon, label);
                    });
                },

                /* ─ API call ─ */
                async fetchWeather(lat, lon, label) {
                    this.loading = true;
                    this.error = null;
                    this.locationLabel = label;
                    try {
                        const url = `${WEATHER_API_ENDPOINT}`;
                        const headers = { 'Content-Type': 'application/json' };
                        const body = { lat: lat, lon: lon }
                        const token = WEATHER_TOKEN

                        if (token) {
                            headers['Authorization'] = `Bearer ${token}`;
                        }
                        const res = await fetch(url, { headers });
                        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
                        const json = await res.json();
                        this.data = json;
                        if (json.location) {
                            const parts = [label, json.location.country].filter(Boolean);
                            this.locationLabel = parts.join(' · ');
                        }
                    } catch (err) {
                        this.error = `Could not load weather data — ${err.message}`;
                        this.data = null;
                    } finally {
                        this.loading = false;
                    }
                },

                /* ─ actions ─ */
                resetSearch() {
                    this.data = null;
                    this.locationLabel = '';
                    this.error = null;
                    const input = document.getElementById('location-search');
                    if (input) input.value = '';
                },

                /* ─ data helpers ─ */
                todayHourly() {
                    if (!this.data?.hourly) return [];
                    const now = this.data.current?.time ?? '';
                    return this.data.hourly.filter(h => h.time >= now).slice(0, 24);
                },

                currentHourly() {
                    if (!this.data?.hourly || !this.data?.current?.time) return null;
                    const currentHour = this.data.current.time.slice(0, 13); // "2026-06-05T21"
                    return this.data.hourly.find(h => h.time.slice(0, 13) === currentHour)
                        ?? this.data.hourly[0];
                },

                todayDaily() {
                    if (!this.data?.daily) return null;
                    const today = this.data.current?.time?.slice(0, 10);
                    return this.data.daily.find(d => d.date === today) ?? this.data.daily[0];
                },

                isNight() {
                    if (!this.data?.current?.time) return false;
                    const h = parseInt(this.data.current.time.slice(11, 13), 10);
                    return h < 6 || h >= 19;
                },

                /* ─ formatting ─ */
                formatTime(isoStr) {
                    if (!isoStr) return '—';
                    const t = isoStr.split('T')[1];
                    if (!t) return '—';
                    const [hh, mm] = t.split(':');
                    const h = parseInt(hh, 10);
                    return `${h % 12 || 12}:${mm} ${h >= 12 ? 'PM' : 'AM'}`;
                },

                formatHour(isoStr) {
                    if (!isoStr) return '';
                    const h = parseInt(isoStr.slice(11, 13), 10);
                    return `${h % 12 || 12}${h >= 12 ? 'pm' : 'am'}`;
                },

                formatDay(dateStr, idx) {
                    if (idx === 0) return 'Today';
                    if (idx === 1) return 'Tomorrow';
                    return new Date(dateStr + 'T12:00:00')
                        .toLocaleDateString('en', { weekday: 'short', month: 'short', day: 'numeric' });
                },

                /* ─ lookups ─ */
                conditionLabel(code) {
                    const map = {
                        '0': 'Clear', '1': 'Mainly Clear', '2': 'Partly Cloudy', '3': 'Overcast',
                        '45': 'Foggy', '48': 'Icy Fog',
                        '51': 'Light Drizzle', '53': 'Drizzle', '55': 'Heavy Drizzle',
                        '61': 'Light Rain', '63': 'Rain', '65': 'Heavy Rain',
                        '71': 'Light Snow', '73': 'Snow', '75': 'Heavy Snow',
                        '80': 'Rain Showers', '81': 'Heavy Showers',
                        '95': 'Thunderstorm', '96': 'Hail Storm',
                    };
                    return map[String(code)] ?? 'Unknown';
                },

                windDir(deg) {
                    if (deg == null) return '—';
                    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                    return dirs[Math.round(deg / 45) % 8];
                },

                uvLabel(uv) {
                    if (uv == null || uv === 0) return 'None';
                    if (uv < 3) return 'Low';
                    if (uv < 6) return 'Moderate';
                    if (uv < 8) return 'High';
                    if (uv < 11) return 'Very High';
                    return 'Extreme';
                },

                uvColor(uv) {
                    if (!uv || uv < 1) return '#22d3ee';
                    if (uv < 3) return '#22d3ee';
                    if (uv < 6) return '#facc15';
                    if (uv < 8) return '#f97316';
                    if (uv < 11) return '#ef4444';
                    return '#a855f7';
                },

                /* ─ temp-range bar helpers ─ */
                _tempRange() {
                    const all = (this.data?.daily ?? []).flatMap(d => [d.temp_min, d.temp_max]);
                    if (!all.length) return { min: 0, range: 1 };
                    const min = Math.min(...all);
                    const range = Math.max(...all) - min || 1;
                    return { min, range };
                },
                tempBarLeft(day) {
                    const { min, range } = this._tempRange();
                    return ((day.temp_min - min) / range) * 100;
                },
                tempBarWidth(day) {
                    const { min, range } = this._tempRange();
                    return ((day.temp_max - day.temp_min) / range) * 100;
                },
            };
        }
    </script>
</body>

</html>
